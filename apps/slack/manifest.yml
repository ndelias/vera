# Vera's Slack app. In Slack: api.slack.com/apps → Create New App → From a
# manifest → pick the workspace → paste this. Stage 1 only sends messages,
# so people can read them but not reply yet; the server (stage 2) turns
# replies on and adds the events it needs.
display_information:
  name: Vera
  description: Your part of each code review, sent to you, and sign-off.
  background_color: "#0b0b0b"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Vera
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
